dataset:
  id: kuangjiao_dataset
  description: "生产线框胶外观缺陷检测历史数据"

root: /data1/wt/data/框胶数据集

task:
  task_id: kuangjiao_inspection_01
  product: kuangjiao
  station: station_01
  camera: cam_01
  inspection_target: glue_defect
  description: "框胶10x连线蓝色背面厚外观缺陷检测"

images:
  glob:
    - "**/*.png"
    - "**/*.jpg"
  exclude: []

quality:
  source: folder
  match_mode: exact
  default: UNCERTAIN
  mapping:
    "漏检": FAIL
    "良品": PASS
    "good": PASS
    "bad": FAIL
    "ng": FAIL

origin:
  source: folder
  mapping:
    "Train": LEGACY_TRAIN
    "Test": LEGACY_TEST
    "数据增强": AUGMENTED
    "漏检": MISSED_CASE
  default: UNKNOWN

annotations:
  format: labelme
  labels:
    "1": scratch
    "11": bubble
    "12": contamination
    "13": foreign_object
    "14": deformation
    "15": breakage
    "16": displacement
    "17": stain
    "18": glue_overflow
    "19": missing
  source: imported
  location_mode: auto
  folder_replace:
    "ExportImage_": "ExportLabel_"
  bbox_policy:
    out_of_bounds: clip
    source_size_mismatch: reject

metadata:
  batch_id:
    source: filename_regex
    pattern: "(?P<batch_id>\\d{4}[-_]\\d{2}[-_]\\d{2}|\\d{2}-\\d{6})"
  physical_sample_id:
    source: filename_regex
    pattern: "(?P<physical_sample_id>ch_\\d+|TrackImg-\\d+|sample_\\d+|\\(\\d+\\))"
  station:
    source: fixed
    value: station_01
  camera:
    source: fixed
    value: cam_01

metadata_semantics:
  batch_id: production_date

readiness_policy:
  standard_ad:
    min_pass: 50
    min_fail: 50
    max_uncertain_ratio: 0.2

candidate_mining:
  policy_name: default
  weights:
    normal_distance: 0.35
    density_outlier: 0.25
    domain_novelty: 0.20
    annotation_signal: 0.20
  diversity_threshold: 0.92

reference_normal:
  include_raw_pass: true
  include_review_pass: true
  include_hard_normal: false

gold:
  policy_name: kuangjiao_gold_v1
  trusted_reviewers:
    - reviewer_1
    - expert_reviewer_1
    - default
  source_priority:
    - HUMAN_REVIEW
    - PRODUCTION_QA
    - EXISTING_QUALITY
  conflict_policy: MARK_CONFLICT
  include_decisions:
    - PASS
    - HARD_NORMAL
    - FAIL

split:
  policy_name: group_stratified_v1
  seed: 42
  ratios:
    train: 0.6
    val: 0.2
    test: 0.2
  group_keys:
    - physical_sample_id
    - capture_sequence_id
    - verified_duplicate
  exclude_origins_from_test:
    - AUGMENTED
