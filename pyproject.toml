[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ad-benchmark-agent"
version = "0.5.0"
description = "Industrial AD Benchmark Agent - DeepSeek Harness & Domain Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "rich>=10.0.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    "typing-extensions>=4.0.0",
    "httpx>=0.24.0",
    "httpx-sse>=0.4.3,<0.5",
    "openai>=2,<3",
    "filelock>=3.16.0",
    "sqlalchemy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
retrieval = [
    "faiss-gpu-cu12>=1.14.1.post1,<2",
]
encoders = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.56.0,<5",
    "huggingface-hub>=0.34,<1",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
iad = "iad_cli.main:app"
iad-benchmark = "iad_cli.main:app"

[tool.setuptools.packages.find]
where = ["python"]
include = ["iad_core*", "iad_cli*"]

[tool.setuptools.package-data]
"iad_core.exploration" = ["presets/*.txt"]
"iad_core.knowledge" = ["directions/*.txt"]
"iad_core.workbench" = ["assets/*.js"]
