[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ad-benchmark-agent"
version = "0.5.0"
description = "Industrial AD Benchmark Agent - DeepSeek Harness & Domain Core"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "typer>=0.9.0",
    "rich>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    "typing-extensions>=4.0.0",
    "faiss-gpu-cu12>=1.7.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx2>=2.0.0",
]

[project.scripts]
iad = "iad_cli.main:app"
iad-benchmark = "iad_cli.main:app"

[tool.setuptools.packages.find]
where = ["python"]
include = ["iad_core*", "iad_domain_server*", "iad_cli*"]
