[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ad-benchmark-agent"
version = "0.1.0"
description = "Industrial AD Benchmark Agent - Dataset Foundation & Scanner"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "typer>=0.9.0",
    "rich>=10.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
iad-benchmark = "app.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
